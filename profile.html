<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier: artist profile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
.back{color:var(--soft);text-decoration:none}.back:hover{color:var(--ink)}
.intro{display:grid;gap:28px;padding:clamp(28px,6vw,64px) 0 40px}
@media(min-width:820px){.intro{grid-template-columns:1.4fr 1fr;align-items:end}}
.role{color:var(--soft);margin:0 0 10px}
h1{font:400 clamp(48px,10vw,110px)/.95 "Instrument Serif",Georgia,serif;letter-spacing:-.03em;margin:0}
.bio{max-width:30em;margin:0 0 20px}
.meta{color:var(--soft);margin:0 0 22px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;border-radius:99px;padding:9px 22px;cursor:pointer}
.follow{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
.follow.on{background:none;color:var(--ink)}
.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.ghost:hover{border-color:var(--ink)}
:is(button,a):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:28px}
.tabs button{background:none;border:0;border-radius:0;padding:12px 0;color:var(--soft);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.wall{columns:2;column-gap:14px}
@media(min-width:720px){.wall{columns:3;column-gap:20px}}
figure{margin:0 0 20px;break-inside:avoid}
.art{border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 14px 30px -18px rgba(0,0,0,.35);transition:transform .35s ease}
figure:hover .art{transform:translateY(-3px)}
figcaption{padding-top:8px;font:400 17px/1.2 "Instrument Serif",Georgia,serif}
figcaption span{display:block;font:400 13px Figtree,sans-serif;color:var(--soft)}
.support{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:20px;padding:30px 0 60px}
.support p{margin:0;max-width:30em}
.support b{font:400 26px/1.15 "Instrument Serif",Georgia,serif;display:block;margin-bottom:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:700px){.intro{gap:20px;padding:24px 0 28px}.row{gap:12px}}
</style>
</head>
<body>
<div class="wrap">
<div id="site-header"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="site.js"></script>

<section class="intro">
<div>
<img class="avatar" id="av" alt="" hidden>
<p class="role">Illustrator and animator</p>
<h1>Ada Nwosu</h1>
</div>
<div>
<p class="bio">Ink drawings and soft-colour animation about markets, rain, and the hour before sunrise.</p>
<p class="meta">Lagos. Sharing since 2026. 14 works.</p>
<div class="row">
<button class="follow" id="follow">Add friend</button>
<button class="ghost" id="tip">Send a tip</button>
</div>
</div>
</section>

<section id="friends" style="display:none"></section>
<main class="wall" id="wall"></main>

<section class="support">
<p><b>Support Ada's studio</b>Your support goes straight to the artist and helps new work get made.</p>
<div class="row"><button class="follow" id="supportBtn">Support</button></div>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
ready.then(async()=>{
const id=new URLSearchParams(location.search).get("id")||(me&&me.id);
if(!id){location.href="auth.html";return}
const pr=await sb.from("profiles").select("*").eq("id",id).maybeSingle();
if(!pr.data){document.querySelector("h1").textContent="Artist not found";return}
const p=pr.data;
document.title=p.display_name+" on Atelier";
if(p.avatar_path){$("av").src=imgUrl(p.avatar_path);$("av").hidden=false}
document.querySelector(".role").textContent="Artist on Atelier";
document.querySelector("h1").textContent=p.display_name||"Artist";
document.querySelector(".bio").textContent=p.bio||"";
const ar=await sb.from("artworks").select("id,title,image_path,thumb_path,kind,body,artist_id").eq("artist_id",id).order("created_at",{ascending:false});
const W=ar.data||[];
document.querySelector(".meta").textContent=W.length+(W.length===1?" work. ":" works. ")+"Joined "+new Date(p.created_at).getFullYear()+".";
document.querySelector(".support b").textContent="Support "+(p.display_name||"this artist")+"'s studio";
$("wall").innerHTML=W.length?W.map(a=>tile(a,false)).join(""):'<p class="empty">No work shared yet.</p>';
async function showFriends(){
const r=await sb.from("follows").select("follower_id,profiles!follows_follower_id_fkey(display_name,avatar_path)",{count:"exact"}).eq("artist_id",id).order("created_at",{ascending:false}).limit(12);
const box=$("friends"),n=r.count||0;
if(!n){box.style.display="none";return}
box.style.display="block";
box.innerHTML='<div class="flab">'+n+(n===1?" friend":" friends")+'</div><div class="frow">'+(r.data||[]).map(function(x){var q=x.profiles||{},nm=q.display_name||"Artist";return '<a class="fr" href="profile.html?id='+x.follower_id+'">'+(q.avatar_path?'<img src="'+imgUrl(q.avatar_path)+'" alt="">':'<span class="ini">'+esc(nm.charAt(0).toUpperCase())+'</span>')+'<span>'+esc(nm)+'</span></a>'}).join("")+'</div>';
}
showFriends();
const own=!!(me&&me.id===id);
const ok=!!p.support_url&&/^https:\/\//i.test(p.support_url);
const openSupport=()=>window.open(p.support_url,"_blank","noopener,noreferrer");
$("supportBtn").onclick=openSupport;
if(!own){if(ok){$("tip").textContent="Support";$("tip").onclick=openSupport}else{$("tip").style.display="none"}}
if(!ok){
if(own){document.querySelector(".support p").innerHTML="<b>Add a support link</b>Add a link in Edit profile so fans can support your work.";$("supportBtn").textContent="Edit profile";$("supportBtn").onclick=()=>{location.href="edit-profile.html"}}
else{document.querySelector(".support").style.display="none"}
}
const f=$("follow");
if(me&&me.id===id){f.style.display="none";$("tip").textContent="Edit profile";$("tip").onclick=()=>{location.href="edit-profile.html"}}
else{
let on=false;
if(me){const r=await sb.from("follows").select("artist_id").eq("follower_id",me.id).eq("artist_id",id);on=!!(r.data&&r.data.length)}
const set=()=>{f.classList.toggle("on",on);f.textContent=on?"Friends":"Add friend"};set();
f.onclick=async()=>{if(!me){location.href="auth.html";return}
const r=on?await sb.from("follows").delete().eq("follower_id",me.id).eq("artist_id",id):await sb.from("follows").insert({follower_id:me.id,artist_id:id});
if(!r.error){on=!on;set();showFriends()}};
}
});
</script>
</body>
</html>
