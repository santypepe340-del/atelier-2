<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier: notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
.col{max-width:640px;margin:0 auto;padding-bottom:80px}
h1{font:400 clamp(44px,9vw,76px)/1 "Instrument Serif",Georgia,serif;letter-spacing:-.03em;margin:clamp(24px,5vw,56px) 0 12px}
.sub{color:var(--soft);margin:0 0 32px}
textarea{width:100%;font:400 22px/1.35 "Instrument Serif",Georgia,serif;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0 10px;border-radius:0;resize:vertical;min-height:90px}
textarea:focus{outline:0;border-color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:10px 0 34px;color:var(--soft);font-size:13px}
.pub{background:var(--ink);color:var(--paper);border:0;border-radius:99px;padding:9px 24px;font:inherit;font-size:15px;cursor:pointer}
.pub:disabled{opacity:.35}
#signin{display:none;margin-bottom:34px;color:var(--soft)}#signin a{color:var(--ink)}
#compose{display:none}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs button{background:none;border:0;padding:12px 0;font:inherit;color:var(--soft);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.note{display:flex;gap:14px;padding:22px 0;border-bottom:1px solid var(--line)}
.note .fr,.note .ini,.note img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.note>a{flex:none;text-decoration:none;color:var(--ink)}
.note .ini{display:grid;place-items:center;background:var(--line)}
.nh{display:flex;gap:10px;align-items:baseline;font-size:14px}
.nh a{color:var(--ink);font-weight:500;text-decoration:none}
.nh span{color:var(--soft)}
.del{margin-left:auto;background:none;border:0;color:var(--soft);font:inherit;font-size:13px;cursor:pointer}
.del:hover{color:var(--ink)}
.note p{margin:4px 0 0;font:400 21px/1.4 "Instrument Serif",Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--soft);padding:28px 0}
.cm{background:none;border:0;color:var(--soft);font:inherit;font-size:13px;padding:8px 0 0;cursor:pointer}.cm:hover{color:var(--ink)}
.thread{margin-top:10px;padding-left:14px;border-left:1px solid var(--line)}
.rc{padding:8px 0;font-size:14px}.rc a{color:var(--ink);text-decoration:none}.rc span{color:var(--soft);margin-left:8px}
.rc p{margin:2px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.cdel{margin-left:8px;background:none;border:0;color:var(--soft);font:inherit;font-size:12px;cursor:pointer}
.rf{display:flex;gap:8px;margin-top:8px}
.rf input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:6px 0;border-radius:0}
.rf input:focus{outline:0;border-color:var(--ink)}
.cpost{background:var(--ink);color:var(--paper);border:0;border-radius:99px;padding:6px 16px;font:inherit;font-size:14px;cursor:pointer}
.rs{color:var(--soft);font-size:14px;margin:8px 0 0}.rs a{color:var(--ink)}
#more{display:none;margin:28px auto 0;background:none;border:1px solid var(--line);border-radius:99px;padding:9px 24px;font:inherit;color:var(--ink);cursor:pointer}
#more:hover{border-color:var(--ink)}
:is(button,a,textarea):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
<div id="site-header"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="site.js"></script>
<div class="col">
<h1>Notes</h1>
<p class="sub">Short thoughts from the community, newest first. No algorithm.</p>
<div id="compose">
<textarea id="body" maxlength="500" placeholder="What are you working on?"></textarea>
<div class="bar"><span id="cnt">0/500</span><button class="pub" id="post" disabled>Post</button></div>
</div>
<p id="signin"><a href="auth.html">Sign in</a> to write a note.</p>
<div class="tabs" id="tabs"><button class="on" data-t="all">Everyone</button><button data-t="friends" id="ft" style="display:none">Friends</button></div>
<div id="list"></div>
<button id="more">Load more</button>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
let tab="all",off=0;const PS=30;const counts={};
function cmLabel(n){return n?n+(n===1?" comment":" comments"):"Comment"}
function ago(t){const s=(Date.now()-new Date(t))/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m";if(s<86400)return Math.floor(s/3600)+"h";if(s<604800)return Math.floor(s/86400)+"d";return new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function item(n){const q=n.profiles||{},nm=q.display_name||"Artist";
const av=q.avatar_path?`<img src="${imgUrl(q.avatar_path)}" alt="">`:`<span class="ini">${esc(nm.charAt(0).toUpperCase())}</span>`;
const del=me&&me.id===n.author_id?`<button class="del" data-id="${n.id}">Delete</button>`:"";
return `<article class="note"><a href="profile.html?id=${n.author_id}" aria-label="${esc(nm)}">${av}</a><div style="flex:1;min-width:0"><div class="nh"><a href="profile.html?id=${n.author_id}">${esc(nm)}</a>${badge(q.founding)}<span>${ago(n.created_at)}</span>${del}</div><p>${esc(n.body)}</p><button class="cm" data-id="${n.id}">${cmLabel(counts[n.id]||0)}</button><div class="thread" id="t-${n.id}" data-author="${n.author_id}" hidden></div></div></article>`}
async function load(reset){
if(reset){off=0;$("list").innerHTML=""}
let q=sb.from("notes").select("id,body,created_at,author_id,profiles!notes_author_id_fkey(display_name,avatar_path,founding)").order("created_at",{ascending:false}).range(off,off+PS-1);
if(tab==="friends"){
const f=await sb.from("follows").select("artist_id").eq("follower_id",me.id);
const ids=(f.data||[]).map(x=>x.artist_id);
if(!ids.length){$("list").innerHTML='<p class="empty">Add friends to see their notes here.</p>';$("more").style.display="none";return}
q=q.in("author_id",ids)}
const r=await q,d=r.data||[];
const ids=d.map(x=>x.id);
if(ids.length){const c=await sb.from("note_comments").select("note_id").in("note_id",ids);(c.data||[]).forEach(x=>{counts[x.note_id]=(counts[x.note_id]||0)+1})}
$("list").insertAdjacentHTML("beforeend",d.map(item).join(""));
if(reset&&!d.length)$("list").innerHTML='<p class="empty">No notes yet. Be the first to write one.</p>';
off+=d.length;$("more").style.display=d.length===PS?"block":"none"}
function count(){const n=$("body").value.length;$("cnt").textContent=n+"/500";$("post").disabled=!$("body").value.trim()}
$("body").oninput=count;
$("post").onclick=async()=>{const body=$("body").value.trim();if(!body)return;$("post").disabled=true;
const r=await sb.from("notes").insert({author_id:me.id,body});
if(r.error){alert("Could not post: "+r.error.message);count();return}
$("body").value="";count();load(true)};
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;[...$("tabs").children].forEach(x=>x.classList.toggle("on",x===b));load(true)};
$("more").onclick=()=>load(false);
async function thread(id){
const box=$("t-"+id);
const r=await sb.from("note_comments").select("id,body,created_at,author_id,profiles!note_comments_author_id_fkey(display_name,founding)").eq("note_id",id).order("created_at");
const d=r.data||[];counts[id]=d.length;
const btn=document.querySelector('.cm[data-id="'+id+'"]');if(btn)btn.textContent=cmLabel(d.length);
box.innerHTML=d.map(x=>{const q=x.profiles||{},nm=q.display_name||"Artist";
const del=me&&(me.id===x.author_id||me.id===box.dataset.author)?`<button class="cdel" data-id="${x.id}" data-note="${id}">Delete</button>`:"";
return `<div class="rc"><a href="profile.html?id=${x.author_id}"><b>${esc(nm)}</b></a>${badge(q.founding)}<span>${ago(x.created_at)}</span>${del}<p>${esc(x.body)}</p></div>`}).join("")+(me?`<div class="rf"><input type="text" maxlength="500" placeholder="Write a comment" aria-label="Write a comment" data-note="${id}"><button class="cpost" data-note="${id}">Post</button></div>`:'<p class="rs"><a href="auth.html">Sign in</a> to comment.</p>')}
$("list").addEventListener("click",async e=>{
const cm=e.target.closest(".cm");
if(cm){const box=$("t-"+cm.dataset.id);if(box.hidden){box.hidden=false;await thread(cm.dataset.id)}else box.hidden=true;return}
const post=e.target.closest(".cpost");
if(post){const id=post.dataset.note,inp=document.querySelector('.rf input[data-note="'+id+'"]'),body=inp.value.trim();if(!body)return;post.disabled=true;
const r=await sb.from("note_comments").insert({note_id:id,author_id:me.id,body});
if(r.error){alert("Could not comment: "+r.error.message);post.disabled=false;return}
await thread(id);return}
const del=e.target.closest(".cdel");
if(del){if(!confirm("Delete this comment?"))return;
const r=await sb.from("note_comments").delete().eq("id",del.dataset.id);
if(r.error){alert("Could not delete: "+r.error.message);return}
await thread(del.dataset.note)}});
$("list").onclick=async e=>{const b=e.target.closest(".del");if(!b||!confirm("Delete this note?"))return;
const r=await sb.from("notes").delete().eq("id",b.dataset.id);
if(r.error){alert("Could not delete: "+r.error.message);return}
load(true)};
ready.then(()=>{
if(me){$("compose").style.display="block";$("ft").style.display="inline-block"}else{$("signin").style.display="block"}
load(true)});
</script>
</body>
</html>
