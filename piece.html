<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
.col{max-width:760px;margin:0 auto;padding-bottom:90px}
.pic{display:block;max-width:100%;max-height:80vh;margin:12px auto 0;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 22px 40px -22px rgba(0,0,0,.4)}
h1{font:400 clamp(34px,7vw,56px)/1.05 "Instrument Serif",Georgia,serif;letter-spacing:-.02em;margin:26px 0 8px}
.by{color:var(--soft);margin:0 0 6px}.by a{color:var(--ink);text-decoration:none}
.about{max-width:36em;margin:14px 0 0}
.text{font:400 22px/1.6 "Instrument Serif",Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere;max-width:34em;margin:26px 0 0}
.row{display:none;gap:10px;flex-wrap:wrap;margin:26px 0 0}
.btn.sm{padding:6px 16px;min-height:0}
.btn.on{background:var(--ink);color:var(--paper)}
h2{font:400 13px Figtree,sans-serif;color:var(--soft);margin:46px 0 6px}
.c{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.c .ini,.c img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center}
.c .h{display:flex;gap:10px;align-items:baseline;font-size:14px}
.c .h a{color:var(--ink);font-weight:500;text-decoration:none}.c .h span{color:var(--soft)}
.c p{margin:3px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.del{margin-left:auto;background:none;border:0;color:var(--soft);font:inherit;font-size:13px;cursor:pointer}
.del:hover{color:var(--ink)}
textarea{width:100%;font:inherit;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0 10px;border-radius:0;resize:vertical;min-height:64px;margin-top:22px}
textarea:focus{outline:0;border-color:var(--ink)}
.msg{color:var(--soft);padding:16px 0}
#cf{display:none}#cs{display:none}
:is(button,a,textarea):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
<div id="site-header"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="site.js"></script>
<div class="col">
<div id="piece"><p class="msg">Loading...</p></div>
<div class="row" id="row"><button class="btn ghost" id="sv">Save</button><button class="btn ghost" id="rm" style="display:none">Delete piece</button><button class="btn ghost" id="tp" style="display:none">Tip coins</button><span id="tpa" style="display:none;gap:8px;align-items:center"><button class="btn ghost sm" data-a="1">1</button><button class="btn ghost sm" data-a="2">2</button><button class="btn ghost sm" data-a="5">5</button></span></div>
<h2 id="ch">Comments</h2>
<div id="cl"></div>
<div id="cf"><textarea id="cb" maxlength="500" placeholder="Say something kind and useful."></textarea><div style="margin-top:12px"><button class="btn" id="cp">Comment</button></div></div>
<p id="cs" class="msg"><a href="auth.html" style="color:var(--ink)">Sign in</a> to comment.</p>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const id=new URLSearchParams(location.search).get("id");
let W=null,own=false,saved=false;
function setSv(){$("sv").textContent=saved?"Saved":"Save";$("sv").classList.toggle("on",saved)}
async function loadC(){
const r=await sb.from("comments").select("id,body,created_at,author_id,profiles(display_name,avatar_path,founding)").eq("artwork_id",id).order("created_at");
const d=r.data||[];
$("ch").textContent=d.length+(d.length===1?" comment":" comments");
$("cl").innerHTML=d.length?d.map(x=>{const q=x.profiles||{},nm=q.display_name||"Artist";
const av=q.avatar_path?`<img src="${imgUrl(q.avatar_path)}" alt="">`:`<span class="ini">${esc(nm.charAt(0).toUpperCase())}</span>`;
const del=me&&(me.id===x.author_id||own)?`<button class="del" data-id="${x.id}">Delete</button>`:"";
return `<div class="c"><a href="profile.html?id=${x.author_id}">${av}</a><div style="flex:1;min-width:0"><div class="h"><a href="profile.html?id=${x.author_id}">${esc(nm)}</a>${badge(q.founding)}<span>${ago(x.created_at)}</span>${del}</div><p>${esc(x.body)}</p></div></div>`}).join(""):'<p class="msg">No comments yet.</p>'}
ready.then(async()=>{
if(!id){location.href="index.html";return}
const r=await sb.from("artworks").select("*,profiles!artworks_artist_id_fkey(display_name,founding),challenges(title)").eq("id",id).maybeSingle();
W=r.data;
if(!W){$("piece").innerHTML='<p class="msg">This piece could not be found.</p>';return}
own=!!(me&&me.id===W.artist_id);
document.title=W.title+" on Atelier";
let h="";
if(W.kind==="image")h+=`<img class="pic" src="${imgUrl(W.image_path)}" alt="${esc(W.title)}">`;
h+=`<h1>${esc(W.title)}</h1><p class="by">by <a href="profile.html?id=${W.artist_id}">${esc(W.profiles&&W.profiles.display_name)}</a>${badge(W.profiles&&W.profiles.founding)}, ${new Date(W.created_at).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}</p>`;
if(W.challenges)h+=`<p class="by">Challenge: <a href="challenges.html">${esc(W.challenges.title)}</a></p>`;
if(W.kind==="writing")h+=`<div class="text">${esc(W.body)}</div>`;else if(W.note)h+=`<p class="about">${esc(W.note)}</p>`;
$("piece").innerHTML=h;
$("row").style.display="flex";
if(own)$("rm").style.display="inline-block";else $("tp").style.display="inline-block";
if(me){
const s=await sb.from("saves").select("artwork_id").eq("user_id",me.id).eq("artwork_id",id);
saved=!!(s.data&&s.data.length);$("cf").style.display="block"}else{$("cs").style.display="block"}
setSv();loadC()});
$("sv").onclick=async()=>{if(!me){location.href="auth.html";return}
const r=saved?await sb.from("saves").delete().eq("user_id",me.id).eq("artwork_id",id):await sb.from("saves").insert({user_id:me.id,artwork_id:id});
if(!r.error){saved=!saved;setSv()}};
$("cp").onclick=async()=>{const body=$("cb").value.trim();if(!body)return;$("cp").disabled=true;
const r=await sb.from("comments").insert({artwork_id:id,author_id:me.id,body});
$("cp").disabled=false;
if(r.error){alert("Could not comment: "+r.error.message);return}
$("cb").value="";loadC()};
$("cl").onclick=async e=>{const b=e.target.closest(".del");if(!b||!confirm("Delete this comment?"))return;
const r=await sb.from("comments").delete().eq("id",b.dataset.id);
if(r.error){alert("Could not delete: "+r.error.message);return}
loadC()};
$("tp").onclick=()=>{if(!me){location.href="auth.html";return}$("tpa").style.display=$("tpa").style.display==="none"?"inline-flex":"none"};
$("tpa").onclick=async e=>{const b=e.target.closest("button");if(!b)return;
const r=await sb.rpc("tip",{p_note:null,p_artwork:id,p_amount:+b.dataset.a});
if(r.error){alert(r.error.message);return}
$("tpa").style.display="none";$("tp").textContent="Tipped "+b.dataset.a;$("tp").disabled=true};
$("rm").onclick=async()=>{if(!confirm("Delete this piece for good?"))return;
const files=[W.image_path,W.thumb_path].filter(Boolean);
if(files.length)await sb.storage.from("artworks").remove(files);
const r=await sb.from("artworks").delete().eq("id",id);
if(r.error){alert("Could not delete: "+r.error.message);return}
location.href="profile.html"};
</script>
</body>
</html>
