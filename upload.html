<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier: share work</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
.back{color:var(--soft);text-decoration:none}.back:hover{color:var(--ink)}
h1{font:400 clamp(40px,7vw,72px)/1 "Instrument Serif",Georgia,serif;letter-spacing:-.025em;margin:clamp(24px,5vw,56px) 0 32px}
.grid{display:grid;gap:36px;padding-bottom:70px}
@media(min-width:820px){.grid{grid-template-columns:1.1fr 1fr;align-items:start}}
.drop{display:grid;place-items:center;text-align:center;min-height:360px;border:1px dashed var(--soft);border-radius:4px;cursor:pointer;padding:24px;transition:background .2s,border-color .2s}
.drop:hover,.drop.over{background:color-mix(in srgb,var(--ink) 5%,transparent);border-color:var(--ink)}
.drop b{font:400 28px/1.1 "Instrument Serif",Georgia,serif;display:block;margin-bottom:6px}
.drop span{color:var(--soft)}
.frame{display:none;padding:14px;background:#fff;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 22px 40px -22px rgba(0,0,0,.4)}
.frame img{display:block;width:100%;max-height:70vh;object-fit:contain}
.frame button{margin-top:12px;background:none;border:0;color:var(--soft);cursor:pointer;font:inherit;padding:0}
label,.lab{display:block;color:var(--soft);font-size:13px;margin:0 0 6px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0 10px;margin-bottom:26px;border-radius:0}
input[type=text]{font:400 26px/1.2 "Instrument Serif",Georgia,serif}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus{outline:0;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dots{display:flex;gap:8px;align-items:center;min-height:28px;margin-bottom:30px;color:var(--soft)}
.dots i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line)}
select{width:100%;font:inherit;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0 10px;margin-bottom:26px;border-radius:0}
.pub{background:var(--ink);color:var(--paper);border:0;border-radius:99px;padding:12px 30px;font:inherit;cursor:pointer}
.pub:disabled{opacity:.3;cursor:not-allowed}
:is(button,a,.drop):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.done{display:none}
.done h2{font:400 clamp(34px,6vw,54px)/1.05 "Instrument Serif",Georgia,serif;margin:0 0 12px}
.done p{color:var(--soft);max-width:26em;margin:0 0 24px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:700px){.drop{min-height:240px}.grid{gap:28px}}
</style>
</head>
<body>
<div class="wrap">
<div id="site-header"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="site.js"></script>
<h1>Share your work</h1>
<p style="color:var(--soft);margin:-18px 0 28px">Artwork, or <a href="write.html" style="color:var(--ink)">write something instead</a>.</p>

<div class="grid">
<div>
<label class="drop" id="drop" for="file" tabindex="0"><div><b>Drop your artwork here</b><span>or tap to choose an image. JPG, PNG, or GIF.</span></div></label>
<input id="file" type="file" accept="image/*" hidden>
<div class="frame" id="frame"><img id="img" alt="Preview of your artwork"><button id="swap">Choose a different image</button></div>
</div>

<div>
<form id="form" onsubmit="return false">
<label for="title">Title</label>
<input type="text" id="title" placeholder="Untitled" autocomplete="off">
<div class="lab">Medium</div>
<div class="chips" id="chips"></div>
<label for="chal">Enter a challenge (optional)</label>
<select id="chal"><option value="">None</option></select>
<label for="note">About this piece</label>
<textarea id="note" placeholder="A line or two, if you like."></textarea>
<div class="lab">Colours we found</div>
<div class="dots" id="dots">Add an image to see them.</div>
<button class="pub" id="pub" disabled>Publish</button>
</form>

<div class="done" id="done">
<h2>Published.</h2>
<p>Your work is now at the top of Newest. It stays there in order, with no ranking, until others share after you.</p>
<button class="pub" id="again">Share another</button>
</div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const M=["Ink","Digital","Watercolour","Oil","3D","Animation","Photography","Mixed"];
const SW={red:"#D2503A",ochre:"#E3A93C",green:"#5E8C61",blue:"#4A74B4",violet:"#8068B8",ink:"#2B2925"};
$("chips").innerHTML=M.map(m=>`<button type="button" class="chip">${m}</button>`).join("");
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(b)b.classList.toggle("on")};
let has=false,file=null;
function ready(){$("pub").disabled=!(has&&$("title").value.trim())}
$("title").oninput=ready;
function load(f){
if(!f||!f.type.startsWith("image/"))return;
file=f;const r=new FileReader();
r.onload=()=>{const im=$("img");im.onload=()=>{colours(im)};im.src=r.result;$("drop").style.display="none";$("frame").style.display="block";has=true;ready()};
r.readAsDataURL(f)}
$("file").onchange=e=>load(e.target.files[0]);
$("swap").onclick=()=>$("file").click();
$("drop").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("file").click()}};
["dragover","dragenter"].forEach(t=>$("drop").addEventListener(t,e=>{e.preventDefault();$("drop").classList.add("over")}));
["dragleave","drop"].forEach(t=>$("drop").addEventListener(t,e=>{e.preventDefault();$("drop").classList.remove("over")}));
$("drop").addEventListener("drop",e=>load(e.dataTransfer.files[0]));
function colours(im){
try{
const c=document.createElement("canvas");c.width=c.height=24;const x=c.getContext("2d");x.drawImage(im,0,0,24,24);
const d=x.getImageData(0,0,24,24).data,n={};
for(let i=0;i<d.length;i+=4){
const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,s=mx-mn;
let k;
if(l<.2)k="ink";else if(s<.12)continue;else{
let h=mx===r?((g-b)/s)%6:mx===g?(b-r)/s+2:(r-g)/s+4;h=(h*60+360)%360;
k=h<20||h>=340?"red":h<70?"ochre":h<170?"green":h<260?"blue":"violet"}
n[k]=(n[k]||0)+1}
const top=Object.entries(n).sort((a,b)=>b[1]-a[1]).slice(0,3).map(a=>a[0]);window.found=top;
$("dots").innerHTML=top.length?top.map(k=>`<i style="background:${SW[k]}" title="${k}"></i>`).join("")+`<span>${top.join(", ")}</span>`:"No strong colours found.";
}catch(e){$("dots").textContent="Colours will be added when you publish."}}
function shrink(file,max,q){return new Promise((res,rej)=>{
const im=new Image(),u=URL.createObjectURL(file);
im.onload=()=>{URL.revokeObjectURL(u);
const s=Math.min(1,max/Math.max(im.width,im.height));
const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
c.getContext("2d").drawImage(im,0,0,c.width,c.height);
c.toBlob(b=>{if(b&&b.type==="image/webp")return res(b);
c.toBlob(j=>j?res(j):rej(new Error("Could not process the image")),"image/jpeg",q)},"image/webp",q)};
im.onerror=()=>rej(new Error("Could not read the image"));
im.src=u})}
$("pub").onclick=async()=>{
if(!me){location.href="auth.html";return}
$("pub").disabled=true;$("pub").textContent="Publishing...";
try{
let full=file,thumb=file;
if(file.type!=="image/gif"){full=await shrink(file,1600,.82);thumb=await shrink(file,600,.8)}
const ext=b=>b.type==="image/webp"?"webp":b.type==="image/jpeg"?"jpg":((file.name.split(".").pop()||"jpg")+"").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
const base=me.id+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
const path=base+"."+ext(full);
const tpath=thumb===full?null:base+"-t."+ext(thumb);
const opt=b=>({contentType:b.type,cacheControl:"31536000"});
let r=await sb.storage.from("artworks").upload(path,full,opt(full));
if(r.error)throw r.error;
if(tpath){r=await sb.storage.from("artworks").upload(tpath,thumb,opt(thumb));if(r.error)throw r.error}
const mediums=[...document.querySelectorAll(".chip.on")].map(c=>c.textContent);
r=await sb.from("artworks").insert({artist_id:me.id,title:$("title").value.trim(),note:$("note").value.trim()||null,mediums:mediums,colours:window.found||[],image_path:path,thumb_path:tpath,challenge_id:$("chal").value||null});
if(r.error)throw r.error;
$("form").style.display="none";$("done").style.display="block";$("pub").textContent="Publish";
}catch(e){alert("Could not publish: "+(e.message||e));$("pub").disabled=false;$("pub").textContent="Publish"}
};
ready.then(async()=>{if(!me){location.href="auth.html";return}
const d=new Date().toISOString().slice(0,10);
const r=await sb.from("challenges").select("id,title").lte("starts_on",d).gte("ends_on",d);
(r.data||[]).forEach(c=>$("chal").insertAdjacentHTML("beforeend",`<option value="${c.id}">${esc(c.title)}</option>`));
const p=new URLSearchParams(location.search).get("challenge");if(p)$("chal").value=p});
$("again").onclick=()=>{$("done").style.display="none";$("form").style.display="block";$("form").reset();document.querySelectorAll(".chip.on").forEach(c=>c.classList.remove("on"));$("frame").style.display="none";$("drop").style.display="grid";$("dots").textContent="Add an image to see them.";has=false;ready()};
</script>
</body>
</html>
