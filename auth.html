<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier: sign in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
.box{max-width:420px;padding:clamp(24px,6vw,64px) 0 80px}
h1{font:400 clamp(40px,8vw,64px)/1 "Instrument Serif",Georgia,serif;letter-spacing:-.025em;margin:0 0 32px}
label{display:block;color:var(--soft);font-size:13px;margin:0 0 6px}
input{width:100%;font:inherit;font-size:18px;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0 10px;margin-bottom:26px;border-radius:0}
input:focus{outline:0;border-color:var(--ink)}
.msg{min-height:24px;color:var(--accent);margin:0 0 14px}
.pub{background:var(--ink);color:var(--paper);border:0;border-radius:99px;padding:12px 30px;font:inherit;cursor:pointer}
.pub:disabled{opacity:.4}
.swap{color:var(--soft);margin-top:26px}.swap a{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
<div id="site-header"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="site.js"></script>
<main class="box">
<h1 id="h">Welcome back</h1>
<form id="f">
<label id="nl" for="name" style="display:none">Name shown on your work</label>
<input id="name" type="text" style="display:none" autocomplete="name">
<label for="email">Email</label>
<input id="email" type="email" required autocomplete="email">
<label for="pw">Password</label>
<input id="pw" type="password" required minlength="6" autocomplete="current-password">
<p id="msg" class="msg" role="status"></p>
<button class="pub" id="go">Sign in</button>
</form>
<p class="swap"><span id="q">New here?</span> <a href="#" id="sw">Create an account</a></p>
</main>
</div>
<script>
let up=false;const $=id=>document.getElementById(id);
$("sw").onclick=e=>{e.preventDefault();up=!up;
$("h").textContent=up?"Join Atelier":"Welcome back";
$("go").textContent=up?"Create account":"Sign in";
$("q").textContent=up?"Already have an account?":"New here?";
$("sw").textContent=up?"Sign in":"Create an account";
$("name").style.display=$("nl").style.display=up?"block":"none";
$("pw").autocomplete=up?"new-password":"current-password";$("msg").textContent=""};
$("f").onsubmit=async e=>{e.preventDefault();$("go").disabled=true;$("msg").textContent="";
const email=$("email").value.trim(),password=$("pw").value;
const r=up?await sb.auth.signUp({email,password,options:{data:{display_name:$("name").value.trim()||undefined}}}):await sb.auth.signInWithPassword({email,password});
$("go").disabled=false;
if(r.error){$("msg").textContent=r.error.message;return}
if(up&&!r.data.session){$("msg").textContent="Check your email to confirm your account, then sign in.";return}
location.href="index.html"};
</script>
</body>
</html>
