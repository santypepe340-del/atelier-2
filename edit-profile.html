<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier: edit profile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
.box{max-width:480px;padding:clamp(24px,6vw,64px) 0 80px}
h1{font:400 clamp(40px,8vw,64px)/1 "Instrument Serif",Georgia,serif;letter-spacing:-.025em;margin:0 0 32px}
label{display:block;color:var(--soft);font-size:13px;margin:0 0 6px}
input[type=text],textarea{width:100%;font:inherit;font-size:18px;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0 10px;margin-bottom:26px;border-radius:0}
textarea{resize:vertical;min-height:90px;margin-bottom:6px}
input:focus,textarea:focus{outline:0;border-color:var(--ink)}
.cnt{color:var(--soft);font-size:13px;text-align:right;margin-bottom:26px}
.photo{display:flex;align-items:center;gap:18px;margin-bottom:30px}
.photo .avatar{width:88px;height:88px;margin:0}
.ghost{background:none;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:8px 20px;font:inherit;cursor:pointer}
.ghost:hover{border-color:var(--ink)}
.msg{min-height:24px;color:var(--accent);margin:0 0 14px}
.pub{background:var(--ink);color:var(--paper);border:0;border-radius:99px;padding:12px 30px;font:inherit;cursor:pointer}
.pub:disabled{opacity:.4}
.cancel{margin-left:16px;color:var(--soft);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<div id="site-header"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="site.js"></script>
<main class="box">
<h1>Edit profile</h1>
<form id="f">
<div class="photo">
<img class="avatar" id="pv" alt="Your photo" hidden>
<div><button type="button" class="ghost" id="pick">Choose photo</button></div>
<input id="file" type="file" accept="image/*" hidden>
</div>
<label for="name">Name shown on your work</label>
<input id="name" type="text" maxlength="60" required autocomplete="name">
<label for="bio">About you</label>
<textarea id="bio" maxlength="300" placeholder="What do you make? A line or two is plenty."></textarea>
<div class="cnt" id="cnt">0/300</div>
<p id="msg" class="msg" role="status"></p>
<button class="pub" id="go">Save</button><a class="cancel" href="profile.html">Cancel</a>
</form>
</main>
</div>
<script>
const $=id=>document.getElementById(id);let file=null,old=null;
function count(){$("cnt").textContent=$("bio").value.length+"/300"}
ready.then(async()=>{
if(!me){location.href="auth.html";return}
const r=await sb.from("profiles").select("display_name,bio,avatar_path").eq("id",me.id).maybeSingle();
const p=r.data||{};old=p.avatar_path||null;
$("name").value=p.display_name||"";$("bio").value=p.bio||"";
if(old){$("pv").src=imgUrl(old);$("pv").hidden=false}
count()});
$("bio").oninput=count;
$("pick").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(!f||!f.type.startsWith("image/"))return;file=f;const r=new FileReader();r.onload=()=>{$("pv").src=r.result;$("pv").hidden=false};r.readAsDataURL(f)};
$("f").onsubmit=async e=>{e.preventDefault();$("go").disabled=true;$("msg").textContent="";
try{
let path=old;
if(file){
const ext=((file.name.split(".").pop()||"jpg")+"").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
path=me.id+"/avatar-"+Date.now()+"."+ext;
const u=await sb.storage.from("artworks").upload(path,file,{contentType:file.type});
if(u.error)throw u.error}
const r=await sb.from("profiles").update({display_name:$("name").value.trim(),bio:$("bio").value.trim()||null,avatar_path:path}).eq("id",me.id);
if(r.error)throw r.error;
if(file&&old)sb.storage.from("artworks").remove([old]);
location.href="profile.html";
}catch(err){$("msg").textContent=err.message||String(err);$("go").disabled=false}};
</script>
</body>
</html>
