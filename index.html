<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500&display=swap">
<style>
:root{--paper:#F6F5F1;--ink:#26241F;--soft:#7C786F;--line:#E3E0D8;--accent:#2F3FBF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1E1D1A;--ink:#EDEBE4;--soft:#9A968B;--line:#33312C;--accent:#8C98FF}}
:root[data-theme="dark"]{--paper:#1E1D1A;--ink:#EDEBE4;--soft:#9A968B;--line:#33312C;--accent:#8C98FF}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.mark{font:400 28px/1 "Instrument Serif",Georgia,serif;letter-spacing:-.01em}
nav{display:flex;gap:22px;color:var(--soft)}
nav a{color:inherit;text-decoration:none}nav a:hover,nav a.on{color:var(--ink)}
.upload{border:1px solid var(--ink);color:var(--ink);background:none;border-radius:99px;padding:8px 18px;font:inherit;cursor:pointer}
.upload:hover{background:var(--ink);color:var(--paper)}
h1{font:400 clamp(40px,8vw,84px)/1 "Instrument Serif",Georgia,serif;letter-spacing:-.025em;margin:clamp(36px,8vw,88px) 0 18px;max-width:11em}
h1 em{color:var(--soft)}
.sub{color:var(--soft);max-width:34em;margin:0 0 36px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:28px}
.modes,.sw{display:flex;gap:6px;align-items:center}
.modes button{background:none;border:0;font:inherit;color:var(--soft);padding:6px 12px;border-radius:99px;cursor:pointer}
.modes button.on{color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.sw span{color:var(--soft);margin-right:6px}
.sw button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}
.sw button.on{outline:2px solid var(--accent);outline-offset:2px}
:is(button,a):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wall{columns:2;column-gap:14px}
@media(min-width:720px){.wall{columns:3;column-gap:20px}}
@media(min-width:1020px){.wall{columns:4}}
figure{margin:0 0 20px;break-inside:avoid;position:relative}
.art{border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 14px 30px -18px rgba(0,0,0,.35);transition:transform .35s ease}
figure:hover .art{transform:translateY(-3px)}
figcaption{padding-top:8px;font-size:13px;line-height:1.35}
figcaption b{font:400 17px/1.2 "Instrument Serif",Georgia,serif;display:block}
figcaption span{color:var(--soft)}
@media(hover:hover){figcaption{opacity:0;transition:opacity .25s}figure:hover figcaption,figure:focus-within figcaption{opacity:1}}
footer{padding:40px 0 60px;color:var(--soft);font-size:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="mark">Atelier</div>
<nav><a class="on" href="#">Discover</a><a href="#">Collections</a><a href="#">Studios</a></nav>
<button class="upload">Share work</button>
</header>

<h1>Everyone's work, in the order it <em>arrived.</em></h1>
<p class="sub">No ranking, no feed tricks. Look through the wall, follow who moves you, and keep what you love.</p>

<div class="bar">
<div class="modes" id="modes"><button class="on" data-m="new">Newest</button><button data-m="shuffle">Shuffle</button></div>
<div class="sw" id="sw"><span>Colour</span></div>
</div>

<main class="wall" id="wall"></main>
<footer>Placeholder artwork. Your creators' real work goes here.</footer>
</div>

<script>
const A=[
["Low tide, 6 a.m.","Ada N.","blue",1.25,"#8FB4D9","#E9D9B8","#35567A"],
["Marigold study","Tolu A.","ochre",.8,"#F2B84B","#D9742B","#F6E3B4"],
["Quiet fern","Mira K.","green",1.5,"#9DB88A","#2F5A45","#DDE6C9"],
["Night market","Chidi O.","violet",1.1,"#6A4C9C","#E07A8F","#241B3A"],
["Ember","Sade B.","red",.9,"#E2563B","#F3A27D","#5A1D1D"],
["Paper boats","Leo V.","blue",1.4,"#B9CDE8","#F4EFE3","#6F8FBF"],
["Dust and brass","Ife R.","ochre",1.2,"#C99A4A","#6B4A24","#EAD9B5"],
["Harmattan light","Zainab M.","ochre",.75,"#F0C98A","#C9825A","#F8EBD3"],
["Moss, enlarged","Jun P.","green",1,"#5E8C61","#B7CF8E","#1F3B2D"],
["Soft machine","Kemi L.","violet",1.3,"#B8A6DC","#7D6BB0","#EFEAF8"],
["Red room","Oto D.","red",1.15,"#C4372F","#F08A6B","#3A1210"],
["Deep water","Anya S.","blue",.85,"#2D4F8A","#79A6D6","#0F1E3A"],
["Garden after rain","Femi T.","green",1.35,"#7FB08F","#E4EFC2","#2E5B4B"],
["Ink and ember","Nia C.","ink",1.05,"#3A3834","#D9673A","#14130F"]
];
const wall=document.getElementById("wall");let mode="new",hue=null;
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(){
let list=A.filter(a=>!hue||a[2]===hue);if(mode==="shuffle")list=shuf(list);
wall.innerHTML=list.map(a=>`<figure tabindex="0"><div class="art" style="aspect-ratio:1/${a[3]};background:radial-gradient(circle at 28% 24%,${a[4]},transparent 58%),radial-gradient(circle at 76% 72%,${a[5]},transparent 62%),${a[6]}"></div><figcaption><b>${a[0]}</b><span>${a[1]}</span></figcaption></figure>`).join("")}
document.getElementById("modes").onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.m;[...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b));draw()};
const sw=document.getElementById("sw");
[["red","#D2503A"],["ochre","#E3A93C"],["green","#5E8C61"],["blue","#4A74B4"],["violet","#8068B8"],["ink","#2B2925"]].forEach(([n,c])=>{const b=document.createElement("button");b.style.background=c;b.title=n;b.setAttribute("aria-label",n);b.onclick=()=>{hue=hue===n?null:n;[...sw.querySelectorAll("button")].forEach(x=>x.classList.toggle("on",x===b&&hue));draw()};sw.appendChild(b)});
draw();
</script>
</body>
</html>
