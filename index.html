<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
h1{font:400 clamp(40px,8vw,84px)/1 "Instrument Serif",Georgia,serif;letter-spacing:-.025em;margin:clamp(36px,8vw,88px) 0 18px;max-width:11em}
h1 em{color:var(--soft)}
.sub{color:var(--soft);max-width:34em;margin:0 0 36px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:28px}
.modes,.sw{display:flex;gap:6px;align-items:center}
.modes button{background:none;border:0;font:inherit;color:var(--soft);padding:6px 12px;border-radius:99px;cursor:pointer}
.modes button.on{color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.sw span{color:var(--soft);margin-right:6px}
.sw button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}
.sw button.on{outline:2px solid var(--accent);outline-offset:2px}
:is(button,a):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wall{columns:2;column-gap:14px}
@media(min-width:720px){.wall{columns:3;column-gap:20px}}
@media(min-width:1020px){.wall{columns:4}}
figure{margin:0 0 20px;break-inside:avoid;position:relative}
.art{border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 14px 30px -18px rgba(0,0,0,.35);transition:transform .35s ease}
figure:hover .art{transform:translateY(-3px)}
figcaption{padding-top:8px;font-size:13px;line-height:1.35}
figcaption b{font:400 17px/1.2 "Instrument Serif",Georgia,serif;display:block}
figcaption span{color:var(--soft)}
@media(hover:hover){figcaption{opacity:0;transition:opacity .25s}figure:hover figcaption,figure:focus-within figcaption{opacity:1}}
footer{padding:40px 0 60px;color:var(--soft);font-size:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:700px){h1{margin:28px 0 14px}.sub{margin-bottom:26px}.bar{flex-direction:column;align-items:flex-start;gap:16px;padding:16px 0;margin-bottom:24px}.modes{flex-wrap:wrap}.modes button{padding:9px 16px}.sw{gap:10px;flex-wrap:wrap}.sw button{width:30px;height:30px}}
</style>
</head>
<body>
<div class="wrap">
<div id="site-header"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="site.js"></script>

<h1>Everyone's work, in the order it <em>arrived.</em></h1>
<p class="sub">No ranking, no feed tricks. Look through the wall, follow who moves you, and keep what you love.</p>

<div class="bar">
<div class="modes" id="modes"><button class="on" data-m="new">Newest</button><button data-m="shuffle">Shuffle</button><button data-m="foryou" id="fy" style="display:none">For you</button></div>
<div class="sw" id="sw"><span>Colour</span></div>
</div>

<main class="wall" id="wall"></main>
<footer>Atelier. A home for creators, with no algorithm.</footer>
</div>

<script>
const $=id=>document.getElementById(id);
const wall=$("wall");let mode="new",hue=null,A=[],mine=[],fr=new Set();
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rank(list){
const cnt={};A.forEach(a=>{cnt[a.artist_id]=(cnt[a.artist_id]||0)+1});
const now=Date.now();
const sc=list.filter(a=>!me||a.artist_id!==me.id).map(a=>{
const ov=(a.mediums||[]).filter(m=>mine.includes(m));
let s=Math.min(ov.length,2)*2;
const isF=fr.has(a.artist_id);if(isF)s+=2;
s+=Math.exp(-((now-new Date(a.created_at))/864e5)/14);
const isNew=cnt[a.artist_id]<=3;if(isNew)s+=1;
s+=Math.random()*1.5;
a._why=ov.length?"Because you like "+ov.join(", ").toLowerCase():isF?"From a friend":isNew?"New to Atelier":"A fresh pick";
return [s,a]}).sort((x,y)=>y[0]-x[0]).map(x=>x[1]);
const seen={},first=[],rest=[];
sc.forEach(a=>{seen[a.artist_id]=(seen[a.artist_id]||0)+1;(seen[a.artist_id]<=2?first:rest).push(a)});
return first.concat(rest)}
function draw(){
let l=A.filter(a=>!hue||(a.colours||[]).includes(hue));if(mode!=="foryou")A.forEach(a=>{a._why=""});if(mode==="shuffle")l=shuf(l);if(mode==="foryou")l=rank(l);
wall.innerHTML=l.length?l.map(a=>tile(a,true)).join(""):`<p class="empty">${A.length?"No work in this colour yet.":'Nothing here yet. <a href="upload.html">Share the first piece.</a>'}</p>`}
$("modes").onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.m;[...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b));draw()};
const sw=$("sw");
[["red","#D2503A"],["ochre","#E3A93C"],["green","#5E8C61"],["blue","#4A74B4"],["violet","#8068B8"],["ink","#2B2925"]].forEach(([n,c])=>{const b=document.createElement("button");b.style.background=c;b.title=n;b.setAttribute("aria-label",n);b.onclick=()=>{hue=hue===n?null:n;[...sw.querySelectorAll("button")].forEach(x=>x.classList.toggle("on",x===b&&hue));draw()};sw.appendChild(b)});
ready.then(async()=>{
const r=await sb.from("artworks").select("id,title,image_path,thumb_path,kind,body,colours,mediums,created_at,artist_id,profiles(display_name)").order("created_at",{ascending:false}).limit(200);
A=r.data||[];
if(me){
const [p,f]=await Promise.all([sb.from("profiles").select("interests").eq("id",me.id).maybeSingle(),sb.from("follows").select("artist_id").eq("follower_id",me.id)]);
mine=(p.data&&p.data.interests)||[];fr=new Set((f.data||[]).map(x=>x.artist_id));
$("fy").style.display="inline-block"}
draw()});
</script>
</body>
</html>
