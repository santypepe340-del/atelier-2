<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier</title>
<meta name="description" content="A home for creatives with no algorithm burying your work. Post, share your art, and connect, newest first.">
<meta property="og:title" content="Atelier">
<meta property="og:description" content="A home for creatives with no algorithm burying your work. Post, share your art, and connect, newest first.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
.col{max-width:640px;margin:0 auto;padding-bottom:90px}
.eyebrow{color:var(--accent);font-size:13px;margin:clamp(24px,5vw,56px) 0 0}
#intro{display:none}
#intro h1{font:400 clamp(40px,9vw,72px)/1 "Instrument Serif",Georgia,serif;letter-spacing:-.025em;margin:12px 0 14px}
.sub{color:var(--soft);margin:0 0 22px}
.introrow{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 36px}
textarea{width:100%;font:400 22px/1.35 "Instrument Serif",Georgia,serif;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0 10px;border-radius:0;resize:vertical;min-height:84px}
textarea:focus{outline:0;border-color:var(--ink)}
#compose{display:none;margin-top:clamp(20px,4vw,40px)}
.prev{margin:12px 0 0;position:relative}.prev[hidden]{display:none}
.prev img{display:block;max-width:100%;max-height:260px;border-radius:8px}
.prev button{margin-top:6px;background:none;border:0;color:var(--soft);font:inherit;font-size:13px;cursor:pointer;padding:0}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 30px;color:var(--soft);font-size:13px}
.bar2 .l{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pub{background:var(--ink);color:var(--paper);border:0;border-radius:99px;padding:9px 24px;font:inherit;font-size:15px;cursor:pointer}
.pub:disabled{opacity:.35}
.link{background:none;border:0;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;padding:0;text-decoration:underline}
#signin{display:none;margin:22px 0;color:var(--soft)}#signin a{color:var(--ink)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs button{background:none;border:0;padding:12px 0;font:inherit;color:var(--soft);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.note{display:flex;gap:14px;padding:22px 0;border-bottom:1px solid var(--line)}
.note>a{flex:none;text-decoration:none;color:var(--ink)}
.note>a img,.note>a .ini{width:40px;height:40px;border-radius:50%;object-fit:cover;display:grid;place-items:center}
.note .ini{background:var(--line)}
.nh{display:flex;gap:10px;align-items:baseline;font-size:14px}
.nh a{color:var(--ink);font-weight:500;text-decoration:none}
.nh span{color:var(--soft)}
.del{margin-left:auto;background:none;border:0;color:var(--soft);font:inherit;font-size:13px;cursor:pointer}
.del:hover{color:var(--ink)}
.note p{margin:4px 0 0;font:400 21px/1.4 "Instrument Serif",Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere}
.pimg{display:block;max-width:100%;max-height:560px;border-radius:8px;margin:10px 0 0;border:1px solid var(--line)}
.act{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:4px;color:var(--soft);font-size:13px}
.ab,.cm{background:none;border:0;color:inherit;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:8px 0}
.ab:hover,.cm:hover{color:var(--ink)}
.ab.on{color:#D2503A}.ab.on svg{fill:currentColor}
.ab:disabled{cursor:default;opacity:.7}
.tipbox{display:flex;gap:8px;margin:2px 0 6px}.tipbox[hidden]{display:none}
.tipbox button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
.tipbox button:hover{border-color:var(--ink)}
.thread{margin-top:6px;padding-left:14px;border-left:1px solid var(--line)}
.rc{padding:8px 0;font-size:14px}.rc a{color:var(--ink);text-decoration:none}.rc span{color:var(--soft);margin-left:8px}
.rc p{margin:2px 0 0;font:400 15px/1.45 Figtree,sans-serif;overflow-wrap:anywhere;white-space:pre-wrap}
.cdel{margin-left:8px;background:none;border:0;color:var(--soft);font:inherit;font-size:12px;cursor:pointer}
.rf{display:flex;gap:8px;margin-top:8px}
.rf input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:6px 0;border-radius:0}
.rf input:focus{outline:0;border-color:var(--ink)}
.cpost{background:var(--ink);color:var(--paper);border:0;border-radius:99px;padding:6px 16px;font:inherit;font-size:14px;cursor:pointer}
.rs{color:var(--soft);font-size:14px;margin:8px 0 0}.rs a{color:var(--ink)}
.empty{color:var(--soft);padding:28px 0}
#more{display:none;margin:28px auto 0;background:none;border:1px solid var(--line);border-radius:99px;padding:9px 24px;font:inherit;color:var(--ink);cursor:pointer}
#more:hover{border-color:var(--ink)}
:is(button,a,textarea,input):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
<div id="site-header"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="site.js"></script>
<div class="col">
<section id="intro">
<p class="eyebrow">Welcome to Atelier</p>
<h1>A home for creatives, with no algorithm burying your work.</h1>
<p class="sub">Post your thoughts and your art, and everyone's posts show in the order they arrived. No ranking you can't see.</p>
<div class="introrow"><a class="btn" href="auth.html?join=1">Join Atelier</a></div>
</section>
<div id="compose">
<textarea id="body" maxlength="500" placeholder="What are you working on?" aria-label="Write a post"></textarea>
<div class="prev" id="prev" hidden><img id="pv" alt="Image to attach"><br><button type="button" id="rmimg">Remove image</button></div>
<div class="bar2">
<div class="l"><button type="button" class="link" id="addimg">Add image</button><span id="cnt">0/500</span><span id="wal"></span></div>
<button class="pub" id="post" disabled>Post</button>
</div>
<input id="file" type="file" accept="image/*" hidden>
</div>
<p id="signin"><a href="auth.html">Sign in</a> to post, like, and comment.</p>
<div class="tabs" id="tabs"><button class="on" data-t="all">Everyone</button><button data-t="friends" id="ft" style="display:none">Friends</button></div>
<div id="list"></div>
<button id="more">Load more</button>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
let tab="all",off=0,imgFile=null,counts={},liked=new Set(),likeN={},coinN={};const PS=30;
const HEART='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.8 3.6 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.4 0 5.4 3.3 4.2 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"/></svg>';
function cmLabel(n){return n?n+(n===1?" comment":" comments"):"Comment"}
function shrink(file,max,q){return new Promise((res,rej)=>{
const im=new Image(),u=URL.createObjectURL(file);
im.onload=()=>{URL.revokeObjectURL(u);
const s=Math.min(1,max/Math.max(im.width,im.height));
const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
c.getContext("2d").drawImage(im,0,0,c.width,c.height);
c.toBlob(b=>{if(b&&b.type==="image/webp")return res(b);
c.toBlob(j=>j?res(j):rej(new Error("Could not process the image")),"image/jpeg",q)},"image/webp",q)};
im.onerror=()=>rej(new Error("Could not read the image"));
im.src=u})}
function item(n){
const q=n.profiles||{},nm=q.display_name||"Artist",own=!!(me&&me.id===n.author_id);
const av=q.avatar_path?`<img src="${imgUrl(q.avatar_path)}" alt="">`:`<span class="ini">${esc(nm.charAt(0).toUpperCase())}</span>`;
const del=own?`<button class="del" data-id="${n.id}">Delete</button>`:"";
const pic=n.image_path?`<a href="${imgUrl(n.image_path)}" target="_blank" rel="noopener"><img class="pimg" loading="lazy" src="${imgUrl(n.thumb_path||n.image_path)}" alt="Image posted by ${esc(nm)}"></a>`:"";
const body=n.body?`<p>${esc(n.body)}</p>`:"";
const stats=own?`<span class="stl">${likeN[n.id]||0} likes</span><span class="stc">${coinN[n.id]||0} coins</span>`:`<button class="ab tipb">Tip</button>`;
return `<article class="note" data-id="${n.id}" data-own="${own?1:0}" data-img="${esc(n.image_path||"")}" data-thumb="${esc(n.thumb_path||"")}" data-author="${n.author_id}"><a href="profile.html?id=${n.author_id}" aria-label="${esc(nm)}">${av}</a><div style="flex:1;min-width:0"><div class="nh"><a href="profile.html?id=${n.author_id}">${esc(nm)}</a>${badge(q.founding)}<span>${ago(n.created_at)}</span>${del}</div>${body}${pic}<div class="act"><button class="ab lk${liked.has(n.id)?" on":""}" aria-label="Like">${HEART}<span>Like</span></button><button class="cm">${cmLabel(counts[n.id]||0)}</button>${stats}</div><div class="tipbox" hidden><button class="tipamt" data-a="1">1 coin</button><button class="tipamt" data-a="2">2 coins</button><button class="tipamt" data-a="5">5 coins</button></div><div class="thread" hidden></div></div></article>`}
async function load(reset){
if(reset){off=0;$("list").innerHTML="";counts={};liked=new Set();likeN={};coinN={}}
let q=sb.from("notes").select("id,body,image_path,thumb_path,created_at,author_id,profiles!notes_author_id_fkey(display_name,avatar_path,founding)").order("created_at",{ascending:false}).range(off,off+PS-1);
if(tab==="friends"){
const f=await sb.from("follows").select("artist_id").eq("follower_id",me.id);
const ids=(f.data||[]).map(x=>x.artist_id);
if(!ids.length){$("list").innerHTML='<p class="empty">Add friends to see their posts here.</p>';$("more").style.display="none";return}
q=q.in("author_id",ids)}
const r=await q,d=r.data||[];
const ids=d.map(x=>x.id),own={};d.forEach(n=>{if(me&&n.author_id===me.id)own[n.id]=1});
if(ids.length){
const [c,l,t]=await Promise.all([
sb.from("note_comments").select("note_id").in("note_id",ids),
me?sb.from("note_likes").select("note_id,user_id").in("note_id",ids):Promise.resolve({data:[]}),
me?sb.from("coin_tips").select("note_id,amount").in("note_id",ids):Promise.resolve({data:[]})]);
(c.data||[]).forEach(x=>{counts[x.note_id]=(counts[x.note_id]||0)+1});
(l.data||[]).forEach(x=>{if(me&&x.user_id===me.id)liked.add(x.note_id);if(own[x.note_id])likeN[x.note_id]=(likeN[x.note_id]||0)+1});
(t.data||[]).forEach(x=>{if(own[x.note_id])coinN[x.note_id]=(coinN[x.note_id]||0)+x.amount})}
$("list").insertAdjacentHTML("beforeend",d.map(item).join(""));
if(reset&&!d.length)$("list").innerHTML='<p class="empty">Nothing here yet. Be the first to post.</p>';
off+=d.length;$("more").style.display=d.length===PS?"block":"none"}
function count(){const n=$("body").value.length;$("cnt").textContent=n+"/500";$("post").disabled=!($("body").value.trim()||imgFile)}
function clearImg(){imgFile=null;$("prev").hidden=true;$("pv").removeAttribute("src");$("file").value="";count()}
async function loadWallet(){const r=await sb.rpc("get_wallet");if(r.data)$("wal").textContent=r.data.balance+" coins to give this week"}
$("body").oninput=count;
$("addimg").onclick=()=>$("file").click();
$("rmimg").onclick=clearImg;
$("file").onchange=e=>{const f=e.target.files[0];if(!f||!f.type.startsWith("image/"))return;imgFile=f;const r=new FileReader();r.onload=()=>{$("pv").src=r.result;$("prev").hidden=false;count()};r.readAsDataURL(f)};
$("post").onclick=async()=>{
const body=$("body").value.trim();if(!body&&!imgFile)return;
$("post").disabled=true;$("post").textContent="Posting...";
try{
let path=null,tpath=null;
if(imgFile){
let full=imgFile,thumb=imgFile;
if(imgFile.type!=="image/gif"){full=await shrink(imgFile,1600,.82);thumb=await shrink(imgFile,720,.8)}
const ext=b=>b.type==="image/webp"?"webp":b.type==="image/jpeg"?"jpg":((imgFile.name.split(".").pop()||"jpg")+"").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
const base=me.id+"/n-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
path=base+"."+ext(full);tpath=thumb===full?null:base+"-t."+ext(thumb);
const opt=b=>({contentType:b.type,cacheControl:"31536000"});
let u=await sb.storage.from("artworks").upload(path,full,opt(full));if(u.error)throw u.error;
if(tpath){u=await sb.storage.from("artworks").upload(tpath,thumb,opt(thumb));if(u.error)throw u.error}}
const r=await sb.from("notes").insert({author_id:me.id,body,image_path:path,thumb_path:tpath});
if(r.error)throw r.error;
$("body").value="";clearImg();load(true)
}catch(e){alert("Could not post: "+(e.message||e))}
$("post").textContent="Post";count()};
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;[...$("tabs").children].forEach(x=>x.classList.toggle("on",x===b));load(true)};
$("more").onclick=()=>load(false);
async function thread(art){
const id=art.dataset.id,box=art.querySelector(".thread");
const r=await sb.from("note_comments").select("id,body,created_at,author_id,profiles!note_comments_author_id_fkey(display_name,founding)").eq("note_id",id).order("created_at");
const d=r.data||[];counts[id]=d.length;
art.querySelector(".cm").textContent=cmLabel(d.length);
box.innerHTML=d.map(x=>{const q=x.profiles||{},nm=q.display_name||"Artist";
const del=me&&(me.id===x.author_id||me.id===art.dataset.author)?`<button class="cdel" data-id="${x.id}">Delete</button>`:"";
return `<div class="rc"><a href="profile.html?id=${x.author_id}"><b>${esc(nm)}</b></a>${badge(q.founding)}<span>${ago(x.created_at)}</span>${del}<p>${esc(x.body)}</p></div>`}).join("")+(me?`<div class="rf"><input type="text" maxlength="500" placeholder="Write a comment" aria-label="Write a comment"><button class="cpost">Post</button></div>`:'<p class="rs"><a href="auth.html">Sign in</a> to comment.</p>')}
$("list").addEventListener("click",async e=>{
const art=e.target.closest(".note");if(!art)return;
const id=art.dataset.id;
const cm=e.target.closest(".cm");
if(cm){const box=art.querySelector(".thread");if(box.hidden){box.hidden=false;await thread(art)}else box.hidden=true;return}
const post=e.target.closest(".cpost");
if(post){const inp=art.querySelector(".rf input"),body=inp.value.trim();if(!body)return;post.disabled=true;
const r=await sb.from("note_comments").insert({note_id:id,author_id:me.id,body});
if(r.error){alert("Could not comment: "+r.error.message);post.disabled=false;return}
await thread(art);return}
const cdel=e.target.closest(".cdel");
if(cdel){if(!confirm("Delete this comment?"))return;
const r=await sb.from("note_comments").delete().eq("id",cdel.dataset.id);
if(r.error){alert("Could not delete: "+r.error.message);return}
await thread(art);return}
const lk=e.target.closest(".lk");
if(lk){if(!me){location.href="auth.html";return}
const on=liked.has(id);
const r=on?await sb.from("note_likes").delete().eq("note_id",id).eq("user_id",me.id):await sb.from("note_likes").insert({note_id:id,user_id:me.id});
if(r.error)return;
if(on)liked.delete(id);else liked.add(id);
lk.classList.toggle("on",!on);
if(art.dataset.own==="1"){likeN[id]=(likeN[id]||0)+(on?-1:1);art.querySelector(".stl").textContent=likeN[id]+" likes"}
return}
const tb=e.target.closest(".tipb");
if(tb){if(!me){location.href="auth.html";return}const bx=art.querySelector(".tipbox");bx.hidden=!bx.hidden;return}
const ta=e.target.closest(".tipamt");
if(ta){const r=await sb.rpc("tip",{p_note:id,p_artwork:null,p_amount:+ta.dataset.a});
if(r.error){alert(r.error.message);return}
art.querySelector(".tipbox").hidden=true;
const b=art.querySelector(".tipb");b.textContent="Tipped "+ta.dataset.a;b.disabled=true;
$("wal").textContent=r.data.balance+" coins to give this week";return}
const del=e.target.closest(".del");
if(del){if(!confirm("Delete this post?"))return;
const files=[art.dataset.img,art.dataset.thumb].filter(Boolean);
if(files.length)await sb.storage.from("artworks").remove(files);
const r=await sb.from("notes").delete().eq("id",id);
if(r.error){alert("Could not delete: "+r.error.message);return}
load(true)}});
ready.then(()=>{
if(me){$("compose").style.display="block";$("ft").style.display="inline-block";loadWallet()}else{$("signin").style.display="block";$("intro").style.display="block"}
load(true)});
</script>
</body>
</html>
